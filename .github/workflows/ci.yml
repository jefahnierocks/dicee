name: CI

on:
  push:
  pull_request:
    # Validate stacked PRs against their predecessor branches as well as main.
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated revision to Production
        required: true
        default: false
        type: boolean

concurrency:
  # The event name keeps dispatched (possibly deploying) runs out of the push
  # group: cancel-in-progress is evaluated by the new run, so a shared group
  # would let a later push cancel a deploy.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci

jobs:
  validate:
    name: Full repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install publication scanner
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          rg --version
          printf 'probe\n' | rg --pcre2 --quiet 'probe'

      # pnpm version comes from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.11.30
          python-version: 3.13.14
          enable-cache: true

      - name: Prepare manifest Python
        id: manifest-python
        run: |
          uv python install --no-bin "$UV_PYTHON"
          manifest_python="$(uv python find --no-project --managed-python --no-python-downloads --resolve-links "$UV_PYTHON")"
          test -f "$manifest_python" && test -x "$manifest_python" && test ! -L "$manifest_python"
          "$manifest_python" -I -S -B -c 'import json, os, sys; from pathlib import Path; p = Path(sys.executable); root = Path(os.environ["UV_PYTHON_INSTALL_DIR"]).resolve(strict=True); print(json.dumps({"scope": "dicee-manifest-python", "python": str(p), "install_root": str(root), "python_version": list(sys.version_info[:3])})); sys.exit(0 if sys.version_info[:3] == (3, 13, 14) and p == p.resolve(strict=True) and root in p.parents else 2)'
          printf 'python=%s\n' "$manifest_python" >> "$GITHUB_OUTPUT"

      - name: Prepare manifest Git
        id: manifest-git
        env:
          DICEE_MANIFEST_PYTHON: ${{ steps.manifest-python.outputs.python }}
        run: '"$DICEE_MANIFEST_PYTHON" -I -S -B scripts/prepare-manifest-git.py'

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # validate, then production dependency audit, then public-release boundary scan.
      - name: Validate repository
        env:
          DICEE_MANIFEST_GIT: ${{ steps.manifest-git.outputs.git }}
          DICEE_MANIFEST_PYTHON: ${{ steps.manifest-python.outputs.python }}
        run: pnpm validate:ci

      - name: Check generated and formatted diff
        run: git diff --exit-code && git diff --check

      - name: Check WASM size
        run: |
          wasm_path=packages/web/src/lib/wasm/dicee_engine_bg.wasm
          wasm_size=$(wc -c < "$wasm_path")
          echo "WASM size: ${wasm_size} bytes"
          test "$wasm_size" -le 153600

      - name: Upload WASM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-pkg
          path: packages/web/src/lib/wasm/
          retention-days: 1

  deploy-worker:
    name: Deploy Durable Objects Worker
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    environment: Production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @dicee/shared build

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/cloudflare-do
          command: deploy --env=""
          secrets: |
            SUPABASE_URL
            SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  deploy-web:
    name: Deploy web Worker
    runs-on: ubuntu-latest
    needs: [validate, deploy-worker]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    environment: Production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Download validated WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wasm-pkg
          path: packages/web/src/lib/wasm/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public build configuration
        run: test -n "$PUBLIC_SUPABASE_URL" && test -n "$PUBLIC_SUPABASE_ANON_KEY"

      - name: Build shared package
        run: pnpm --filter @dicee/shared build

      - name: Build web application
        run: pnpm --filter @dicee/web build

      - name: Deploy web Worker to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/web
          command: deploy
