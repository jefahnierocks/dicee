pre-commit:
  parallel: true
  commands:
    rust:
      glob: "packages/engine/**/*.{rs,toml}"
      run: mise exec -- sh -c 'cargo fmt --manifest-path packages/engine/Cargo.toml --check && cargo clippy --manifest-path packages/engine/Cargo.toml --all-targets --all-features -- -D warnings'

    typescript:
      glob: "packages/{web,cloudflare-do,shared,simulation}/**/*.{ts,js,svelte,json,jsonc}"
      run: mise exec -- pnpm check:typescript

    biome:
      glob: "packages/{web,cloudflare-do,simulation}/**/*.{ts,js,svelte,json,jsonc}"
      run: mise exec -- pnpm biome:check

    python:
      glob: "packages/analysis/**/*.{py,toml}"
      run: mise exec -- sh -c 'pnpm lint:analysis && pnpm check:analysis'

    worker-types:
      glob: "packages/{web,cloudflare-do}/wrangler.jsonc"
      run: mise exec -- pnpm check:workers

    docs:
      glob: "*.{md,mdc,json,jsonc,toml,yaml,yml,rules}"
      run: mise exec -- node scripts/check-docs.mjs

pre-push:
  commands:
    # validate:ci = validate, then the high-severity dependency audit and the
    # public-safety scan (the same gate CI runs).
    validate-ci:
      run: mise exec -- pnpm validate:ci
