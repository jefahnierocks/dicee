# Public authentication strategy. Live project identifiers and provider
# credentials are operator-managed and intentionally absent from this file.

supabase_auth:
  project_ref: "${SUPABASE_PROJECT_REF}"
  project_url: "${PUBLIC_SUPABASE_URL}"
  settings:
    allow_new_users: true
    allow_manual_linking: true
    allow_anonymous_signins: true
    confirm_email: false
  providers:
    email:
      enabled: true
      mode: "magic_link"
    google:
      enabled: true
      client_id: "secret:GOOGLE_OAUTH_CLIENT_ID"
      client_secret: "secret:GOOGLE_OAUTH_CLIENT_SECRET"
      skip_nonce_checks: false
    anonymous:
      enabled: true
      captcha: "required-before-public-launch"

redirects:
  application_origin: "https://dicee.games"
  callback_path: "/auth/callback"
  provider_callback: "${PUBLIC_SUPABASE_URL}/auth/v1/callback"
  rules:
    - "Only same-origin relative next paths are accepted"
    - "Provider error descriptions are never reflected to the browser"

session_security:
  server_validation: "Always validate with getUser() before trusting a session"
  websocket_transport: "Authorization header through the same-origin service binding"
  prohibited:
    - "access tokens in URLs"
    - "email or provider full name as an automatic public display name"
    - "untrusted external avatar URLs"
