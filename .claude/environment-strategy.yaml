# Dicee Project: Environment & Secrets Strategy
# Last updated: 2026-04-16

secret_authority:
  runtime_app_secrets:
    source: "Infisical"
    usage:
      - "Application runtime secrets"
      - "Local runtime injection via infisical run"
      - "CI/CD and deploy-target secret sync"

  local_operator_bootstrap:
    source: "1Password"
    account: "Operator-selected account"
    vault: "Operator-selected vault"
    usage:
      - "Infisical universal auth client credentials"
      - "Cloudflare operator token"
      - "Optional local-only ElevenLabs key"

  non_secret_metadata:
    source: "Repo versioned metadata"
    file: "scripts/lib/dicee-operator-metadata.sh"

rules:
  - "Do not export secret values from .envrc"
  - "Do not append secret exports to shell startup files"
  - "Do not write bearer tokens into user-global config files"
  - "Do not use the legacy local secret store in active Dicee workflows"

direnv:
  managed_variables:
    - PROJECT_NAME
    - DICEE_PROJECT_ROOT
    - DICEE_ENV
    - DICEE_MCP_ENABLED
    - ENABLE_TOOL_SEARCH
  local_overrides_file: ".envrc.local.nonsecret"

local_bootstrap:
  readiness_check: "./scripts/check-1password-setup.sh"
  wrappers:
    infisical_auth: "./scripts/with-dicee-infisical-auth.sh <dev|staging|prod> -- <command>"
    cloudflare: "./scripts/with-dicee-cloudflare.sh -- <command>"
    elevenlabs_local: "./scripts/with-dicee-elevenlabs-local.sh -- <command>"

mcp:
  project_managed:
    - ".mcp.json"
    - ".cursor/mcp.json"
  remote_auth: "Native HTTP transport with per-client OAuth; no token wrappers (docs/MCP-SETUP.md)"
  global_user_baseline:
    - "Context7"
    - "GitHub"

local_development:
  runtime:
    command: "infisical run --env=dev -- <command>"
  operator_examples:
    - "./scripts/with-dicee-cloudflare.sh -- wrangler whoami"
    - "./scripts/with-dicee-infisical-auth.sh dev -- infisical login --method=universal-auth --domain=$INFISICAL_API_URL"
