# Public-safe local secret bootstrap contract.

policy:
  runtime_app_secrets: "A managed secret service"
  local_operator_bootstrap_secrets: "An OS-integrated credential manager"
  non_secret_metadata: "An ignored local operator metadata file"
  prohibited:
    - "credential values in tracked files"
    - "persistent shell-secret exports"
    - "tokens written into user-global tool configuration"

local_setup:
  metadata_template: "scripts/templates/dicee-operator-metadata.example.sh"
  metadata_destination: ".dicee/operator-metadata.sh"
  requirements:
    - "Keep the destination mode 0600"
    - "Use placeholders in documentation"
    - "Resolve credentials only at process launch"

wrappers:
  readiness_check: "./scripts/check-1password-setup.sh"
  infisical_auth: "./scripts/with-dicee-infisical-auth.sh <environment> -- <command>"
  cloudflare: "./scripts/with-dicee-cloudflare.sh -- <command>"
  elevenlabs_local: "./scripts/with-dicee-elevenlabs-local.sh -- <command>"
