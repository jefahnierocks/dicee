# Dicee Project - Runtime versions and tasks
# Managed by mise (https://mise.jdx.dev)

[tools]
node = "24.18.0"
pnpm = "11.15.1"
# Keep this pinned in sync with packages/engine/rust-toolchain.toml and CI.
rust = "1.97.1"
python = "3.13.14"
uv = "0.11.30"
bun = "1.3.14"
# Local Supabase stack CLI; pinned so db:* tasks do not float with Homebrew.
"aqua:supabase/cli" = "2.117.0"

[tasks]
# Core development tasks
dev = "pnpm dev"
build = "pnpm build"
test = "pnpm test"
check = "pnpm check"

# Linting and formatting (Biome)
lint = "pnpm lint"
format = "pnpm format"

# Web-specific
"web:dev" = "pnpm --filter @dicee/web dev"
"web:build" = "pnpm --filter @dicee/web build"
"web:test" = "pnpm web:vitest"
"web:sync" = "pnpm web:sync"

# Engine (Rust/WASM)
"engine:build" = "pnpm build:engine"
"engine:test" = "pnpm test:rust"
"engine:check" = "pnpm check:rust"

# Database (local Supabase)
"db:start" = "supabase start"
"db:stop" = "supabase stop"
"db:status" = "supabase status"

# Quality gate
quality = "./scripts/quality-gate.sh"

[env]
DICEE_ENV = "development"
