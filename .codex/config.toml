# Repository-scoped Codex configuration; it loads only after the project is trusted.
# Personal model, authentication, approval, and sandbox choices belong in the user
# configuration. Custom agents in .codex/agents/*.toml are discovered automatically.

[agents]
max_concurrent_threads_per_session = 4
max_depth = 1

[mcp_servers.akg]
command = "bun"
args = ["run", "packages/web/src/tools/akg/mcp/server.ts"]
env = { AKG_GRAPH_PATH = "docs/architecture/akg/graph/current.json", AKG_DIAGRAMS_PATH = "docs/architecture/akg/diagrams", AKG_PROJECT_ROOT = "." }

[mcp_servers.cloudflare-docs]
url = "https://docs.mcp.cloudflare.com/mcp"
